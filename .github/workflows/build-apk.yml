name: Build CinemaVerse Pro Pure TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Optional Custom Web Server URL (leave empty for pure internal offline mode)'
        required: false
        default: 'https://appassets.androidplatform.net/assets/tv.html'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Pure Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Configure Web Server URL (if provided)
        if: "${{ github.event.inputs.web_url != '' }}"
        run: |
          URL="${{ github.event.inputs.web_url }}"
          echo "Setting default_web_url to: $URL"
          sed -i "s|<string name=\"default_web_url\">.*</string>|<string name=\"default_web_url\">$URL</string>|g" android/app/src/main/res/values/strings.xml

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Output APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" release-apk/CinemaVerse-Pure-TV.apk
            cp "$APK_PATH" release-apk/CinemaVerse-Pro.apk
            cp "$APK_PATH" release-apk/CinemaVerse-TV-v1.0.apk
            ls -lh release-apk/
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaVerse-Pure-TV-APK
          path: release-apk/CinemaVerse-Pure-TV.apk
          retention-days: 90

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-apk
          name: "CinemaVerse Pro TV — Pure Standalone APK"
          body: |
            ## 📺 CinemaVerse Pro TV — Pure Standalone APK
            
            This is the **pure, standalone native Android TV application** for CinemaVerse Pro with **zero external web server dependencies**.
            
            ### ✨ Highlights
            - **100% Standalone / Pure APK**: Bundles all HTML, CSS, JavaScript, and the complete 1,302-title catalog directly inside the internal APK assets (`file:///android_asset/`). Launches in `< 50ms` directly from TV storage without needing any local computer or server running!
            - **Smart TV Remote & D-Pad Perfection**: Full 10-foot Leanback interface with high-contrast red glowing focus halos, deterministic 2D spatial navigation, and zero remote focus loss.
            - **On-Screen TV Keyboard & Voice Search**: Integrated 6x6 virtual TV keyboard for remote search, plus Android TV microphone voice search support.
            - **10 Mirror Streaming Servers**: Vidly Pro, CineSrc 4K, 123Embed, AutoEmbed, Prime VIP, AnimeWorld, MultiEmbed, VidLink, AnyEmbed, and Nontongo.
            - **Universal Compatibility**: Works on **Android TV, Google TV, Fire TV sticks, tablets, and phones**.
            
            ### ⬇️ Direct Download
            Download **CinemaVerse-Pure-TV.apk** below, copy it to your pen drive, and install it directly on your Smart TV!
          draft: false
          prerelease: false
          files: |
            release-apk/CinemaVerse-Pure-TV.apk
            release-apk/CinemaVerse-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
