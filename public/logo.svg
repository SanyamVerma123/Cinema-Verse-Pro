<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    
    <!-- Red Ribbon Gradients -->
    <linearGradient id="nLeftStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B81D24"/>
      <stop offset="100%" stop-color="#800a0f"/>
    </linearGradient>
    
    <linearGradient id="nRightStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB0510"/>
      <stop offset="100%" stop-color="#99040c"/>
    </linearGradient>
    
    <linearGradient id="nDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="40%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>

    <!-- Drop Shadow for 3D ribbon depth -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.85"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Modern Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(229, 9, 20, 0.35)" stroke-width="3"/>

  <!-- Subtle Ambient Glow under the N -->
  <ellipse cx="256" cy="270" rx="140" ry="170" fill="rgba(229, 9, 20, 0.18)" filter="url(#glow)"/>

  <!-- The Iconic Folded Netflix "N" Ribbon -->
  <g id="ribbon-N">
    <!-- Left Vertical Stem (Dark Red, sits behind) -->
    <rect x="148" y="96" width="68" height="320" rx="3" fill="url(#nLeftStem)"/>

    <!-- Right Vertical Stem (Mid Red, sits behind) -->
    <rect x="296" y="96" width="68" height="320" rx="3" fill="url(#nRightStem)"/>

    <!-- Diagonal Ribbon (Vivid Bright Red, casts deep shadow across left stem) -->
    <polygon points="148,96 216,96 364,416 296,416" fill="url(#nDiagonal)" filter="url(#ribbonShadow)"/>
  </g>

  <!-- Crown / Mirror Pro Top Emblem Badge -->
  <g transform="translate(256, 70) scale(0.9)">
    <circle cx="0" cy="0" r="16" fill="#F59E0B" filter="url(#glow)"/>
    <path d="M-8,4 L-4,-6 L0,-1 L4,-6 L8,4 Z" fill="#111827"/>
  </g>
</svg>
